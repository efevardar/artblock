<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vardar Studio</title>
    <meta
      name="description"
      content="Vardar Studio — independent apps and creative tools. Explore our projects including Art Block."
    />
    <link rel="canonical" href="https://www.vardarstudio.com/" />
    <link rel="stylesheet" href="css/main.css?v=3" />
    <script>
      (function () {
        if (/\/index\.html$/i.test(location.pathname)) {
          history.replaceState(
            null,
            "",
            location.pathname.replace(/\/index\.html$/i, "/") +
              location.search +
              location.hash
          );
        }
      })();
    </script>
  </head>
  <body class="studio-home">
    <canvas
      class="studio-draw-canvas"
      aria-hidden="true"
      width="1"
      height="1"
    ></canvas>
    <div class="studio-cursor-dot" aria-hidden="true"></div>
    <main>
      <section class="studio-hero" data-parallax-hero>
        <div class="wrap studio-hero-inner">
          <h1 class="studio-title">
            <span class="studio-title-vardar">Vardar</span>
            <span class="studio-title-studio">Studio</span>
          </h1>
        </div>
      </section>

      <section class="studio-projects" aria-labelledby="projects-heading">
        <div class="wrap">
          <h2
            id="projects-heading"
            class="studio-projects-heading studio-open-item studio-open-fade"
            data-open-id="projects-heading"
          >
            Our projects
          </h2>
          <ul class="project-list">
            <li class="studio-open-item studio-open-fade" data-open-id="project-card">
              <a href="artblock/" class="project-link">
                <img
                  src="images/LogoType_dark.png"
                  alt="Art Block"
                  class="project-link-logotype"
                  width="400"
                  height="80"
                  decoding="async"
                />
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer
      class="site-footer site-footer--studio studio-open-item studio-open-slide"
      data-open-id="footer"
    >
      <div class="wrap">
        <p class="copyright">
          © <span id="year"></span> Vardar Studio. All rights reserved.
        </p>
      </div>
    </footer>
    <script src="js/interactive-surface.js?v=3" defer></script>
    <script src="js/studio.js?v=3" defer></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      (function () {
        var link = document.querySelector(".project-link");
        if (!link) return;

        link.addEventListener("click", function (e) {
          if (
            e.defaultPrevented ||
            e.button !== 0 ||
            e.metaKey ||
            e.ctrlKey ||
            e.shiftKey ||
            e.altKey
          ) {
            return;
          }
          var href = link.getAttribute("href");
          if (!href) return;

          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            sessionStorage.setItem("vardar-page-transition", "to-artblock");
            return;
          }

          e.preventDefault();
          sessionStorage.setItem("vardar-page-transition", "to-artblock");

          var overlay = document.createElement("div");
          overlay.className = "page-transition-overlay";
          overlay.setAttribute("aria-hidden", "true");
          document.body.appendChild(overlay);

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              overlay.classList.add("is-active");
            });
          });

          var navigated = false;
          function go() {
            if (navigated) return;
            navigated = true;
            window.location.href = href;
          }

          overlay.addEventListener("transitionend", go, { once: true });
          window.setTimeout(go, 550);
        });
      })();
    </script>
  </body>
</html>
